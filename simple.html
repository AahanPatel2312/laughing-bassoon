<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      line-height: 1.6;
    }

    nav {
      background: #1e293b;
      padding: 16px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 14px;
    }

    section {
      max-width: 700px;
      margin: auto;
      padding: 60px 20px;
    }

    #home {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
    }

    h2 {
      margin-bottom: 10px;
      color: #2563eb;
    }

    footer {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home">
    <h1>Hi, I'm Your Name</h1>
    <p>Web Developer | Student | Creator</p>
  </section>

  <section id="about">
    <h2>About</h2>
    <p>Write a few lines about yourself and your skills here.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: you@example.com</p>
  </section>

  <footer>© 2026 Your Name</footer>
</body>

</html>
